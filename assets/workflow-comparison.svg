<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">普通 Codex 对话与 UE PerfectWorld 的执行组织对比</title>
  <desc id="desc">普通 Codex 也可以使用多代理，具体查证、拆分和评审方式取决于当轮约定。UE PerfectWorld 将多子代理协作作为明确执行层：主代理锁定目标、拆分任务并持续关键路径，子代理按依赖并行证据、分块实施、验证和独立审查，主代理整合后对确认缺陷进行范围内修复、受影响复验和最新版复审。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#8b9cb0"/>
    </marker>
    <marker id="loop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#ecad96"/>
    </marker>
  </defs>
  <rect width="1440" height="920" rx="20" fill="#f5f7fb"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="48" y="62" fill="#172335" font-size="35" font-weight="700">把多子代理协作变成可复核的执行组织</text>
    <text x="48" y="102" fill="#52627a" font-size="18">从项目证据出发，按职责分工，以最终整合版本的验证与独立审查收敛。</text>

    <rect x="48" y="142" width="352" height="644" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
    <text x="76" y="187" fill="#27384e" font-size="23" font-weight="700">普通 Codex 对话</text>
    <text x="76" y="219" fill="#718096" font-size="14">未加载专用 UE 工作流时</text>
    <g text-anchor="middle">
      <rect x="94" y="253" width="260" height="66" rx="8" fill="#eff3f8"/>
      <text x="224" y="293" fill="#47566d" font-size="19" font-weight="700">任务与当轮约定</text>
      <path d="M224 321V351" fill="none" stroke="#8b9cb0" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="94" y="355" width="260" height="66" rx="8" fill="#eff3f8"/>
      <text x="224" y="395" fill="#47566d" font-size="19" font-weight="700">查证 / 拆分 / 执行</text>
      <path d="M224 423V453" fill="none" stroke="#8b9cb0" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="94" y="457" width="260" height="66" rx="8" fill="#fff0e9"/>
      <text x="224" y="497" fill="#aa5d44" font-size="19" font-weight="700">验证 / 评审 / 回答</text>
    </g>
    <line x1="76" y1="558" x2="372" y2="558" stroke="#d9e2ec"/>
    <text x="76" y="594" fill="#52627a" font-size="15">可以采用多代理与深入查证</text>
    <text x="76" y="626" fill="#52627a" font-size="15">具体分工、整合与复审方式</text>
    <text x="76" y="658" fill="#52627a" font-size="15">依赖当轮提示和实际执行</text>
    <text x="76" y="735" fill="#718096" font-size="14">专用约定需要随任务明确</text>

    <rect x="424" y="142" width="968" height="644" rx="8" fill="#20334c"/>
    <text x="452" y="187" fill="#ffffff" font-size="23" font-weight="700">UE PerfectWorld · 主代理 + 多子代理</text>
    <text x="452" y="219" fill="#cbd7e5" font-size="14">大且可分离的任务尽早并行；下列角色按依赖启动，可跨检查点复用</text>

    <g fill="none" stroke="#8b9cb0" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M658 368H692V289H726"/>
      <path d="M692 368H726"/>
      <path d="M692 368V447H726"/>
      <path d="M1000 289H1028V368H1056"/>
      <path d="M1000 368H1056"/>
      <path d="M1000 447H1028V368"/>
    </g>
    <rect x="452" y="267" width="206" height="202" rx="8" fill="#304760" stroke="#59738f"/>
    <text x="476" y="306" fill="#83ddc8" font-size="20" font-weight="700">主代理统筹</text>
    <text x="476" y="345" fill="#ffffff" font-size="17">目标与授权范围</text>
    <text x="476" y="377" fill="#d1dce8" font-size="15">拆分 / 接口 / 依赖</text>
    <text x="476" y="409" fill="#d1dce8" font-size="15">持续推进关键路径</text>
    <text x="476" y="445" fill="#f3ce8b" font-size="13">不等待所有子任务才行动</text>

    <rect x="728" y="255" width="272" height="68" rx="8" fill="#e6f6f0"/>
    <text x="750" y="284" fill="#217c6b" font-size="18" font-weight="700">证据子代理</text>
    <text x="750" y="307" fill="#45675e" font-size="13">调用链 / 配置 / 资产 / 所有权</text>
    <rect x="728" y="334" width="272" height="68" rx="8" fill="#edf0ff"/>
    <text x="750" y="363" fill="#4e5fc2" font-size="18" font-weight="700">分块实施子代理</text>
    <text x="750" y="386" fill="#59677d" font-size="13">证据与规格就绪 · 单一写入者</text>
    <rect x="728" y="413" width="272" height="68" rx="8" fill="#fff0e9"/>
    <text x="750" y="442" fill="#aa5d44" font-size="18" font-weight="700">验证 / 独立审查子代理</text>
    <text x="750" y="465" fill="#856a5d" font-size="13">稳定分块可重叠 · 最终重读最新版</text>

    <rect x="1058" y="267" width="306" height="202" rx="8" fill="#304760" stroke="#59738f"/>
    <text x="1082" y="306" fill="#83ddc8" font-size="20" font-weight="700">主代理汇合整合</text>
    <text x="1082" y="345" fill="#ffffff" font-size="17">组合契约与最终源码</text>
    <text x="1082" y="377" fill="#d1dce8" font-size="15">确认发现、处理范围内问题</text>
    <text x="1082" y="409" fill="#d1dce8" font-size="15">对账验证与未验证事项</text>
    <text x="1082" y="445" fill="#f3ce8b" font-size="13">优先复用、配置与局部修复</text>

    <line x1="452" y1="517" x2="1364" y2="517" stroke="#526a85"/>
    <text x="452" y="551" fill="#83ddc8" font-size="17" font-weight="700">整合后的修复复审回环</text>
    <g text-anchor="middle">
      <rect x="452" y="580" width="184" height="70" rx="8" fill="#304760" stroke="#59738f"/>
      <text x="544" y="622" fill="#ffffff" font-size="16" font-weight="700">确认缺陷</text>
      <rect x="694" y="580" width="184" height="70" rx="8" fill="#304760" stroke="#59738f"/>
      <text x="786" y="622" fill="#ffffff" font-size="16" font-weight="700">范围内修复</text>
      <rect x="936" y="580" width="184" height="70" rx="8" fill="#304760" stroke="#59738f"/>
      <text x="1028" y="622" fill="#ffffff" font-size="16" font-weight="700">受影响复验</text>
      <rect x="1178" y="580" width="186" height="70" rx="8" fill="#304760" stroke="#59738f"/>
      <text x="1271" y="622" fill="#ffffff" font-size="16" font-weight="700">最新版独立复审</text>
    </g>
    <g fill="none" stroke="#8b9cb0" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M638 615H692"/>
      <path d="M880 615H934"/>
      <path d="M1122 615H1176"/>
    </g>
    <path d="M1271 652V694H544V652" fill="none" stroke="#ecad96" stroke-width="2.5" marker-end="url(#loop)"/>
    <rect x="789" y="681" width="240" height="26" fill="#20334c"/>
    <text x="909" y="700" text-anchor="middle" fill="#ecad96" font-size="14">仍有确认缺陷 → 继续修复复审</text>
    <text x="452" y="752" fill="#cbd7e5" font-size="14">按真实容量安排并发；每文件或资产单写者；不为局部需求增加通用机制</text>

    <rect x="48" y="818" width="1344" height="62" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
    <text x="72" y="844" fill="#27384e" font-size="15" font-weight="700">S0-S6 是检查点，不是七轮审批或七个代理；明确实现授权内可连续推进，只读请求保持只读</text>
    <text x="72" y="867" fill="#52627a" font-size="13">setup 默认子代理上限 12（不含主代理），受运行时容量约束且不强制填满；未运行验证如实列出，不自动提交或推送</text>
  </g>
</svg>

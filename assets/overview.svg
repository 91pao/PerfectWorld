<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
  <title id="title">UE PerfectWorld 如何融入 UE 项目开发</title>
  <desc id="desc">将 Unreal Engine 项目中的 C++、蓝图和日志交给 Codex 的 UE 专用技能分析；变更规格经过用户批准后，形成有证据、有验证记录的开发交付。图中说明这是 Codex 工作流插件，不是 Unreal Editor 扩展。</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcff"/>
      <stop offset="1" stop-color="#edf6f4"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18283b"/>
      <stop offset="1" stop-color="#253958"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54cdb2"/>
      <stop offset=".55" stop-color="#7688f8"/>
      <stop offset="1" stop-color="#ed8c70"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#24334b" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8b9aae"/>
    </marker>
  </defs>

  <rect width="1440" height="650" rx="24" fill="url(#surface)"/>
  <circle cx="1350" cy="55" r="175" fill="#f3c374" opacity=".18"/>
  <circle cx="75" cy="605" r="170" fill="#54cdb2" opacity=".13"/>

  <text x="72" y="82" fill="#52627a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">UE DEVELOPMENT WORKFLOW · CODEX PLUGIN</text>
  <text x="72" y="146" fill="#172335" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="42" font-weight="700">让改动从项目证据出发</text>
  <text x="74" y="184" fill="#52627a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20">理解现状 → 明确改动 → 经你批准 → 验证并交接</text>

  <g filter="url(#shadow)">
    <rect x="72" y="232" width="320" height="270" rx="18" fill="#ffffff" stroke="#dbe4ed"/>
    <rect x="480" y="232" width="390" height="270" rx="22" fill="url(#engine)"/>
    <rect x="964" y="232" width="404" height="270" rx="18" fill="#ffffff" stroke="#dbe4ed"/>
  </g>

  <text x="102" y="275" fill="#172335" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="700">你的 UE 项目</text>
  <text x="102" y="305" fill="#718096" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">从真实工程上下文开始</text>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="102" y="342" width="260" height="42" rx="10" fill="#eef4ff"/>
    <rect x="102" y="342" width="6" height="42" rx="3" fill="#7387ff"/>
    <text x="124" y="369" fill="#34445b" font-size="16" font-weight="600">C++ 源码与模块</text>
    <text x="336" y="369" fill="#7387ff" font-size="15" text-anchor="end">.h  .cpp</text>

    <rect x="102" y="395" width="260" height="42" rx="10" fill="#eaf8f4"/>
    <rect x="102" y="395" width="6" height="42" rx="3" fill="#43b99d"/>
    <text x="124" y="422" fill="#34445b" font-size="16" font-weight="600">蓝图与资产引用</text>
    <text x="336" y="422" fill="#32957f" font-size="15" text-anchor="end">BP  Asset</text>

    <rect x="102" y="448" width="260" height="42" rx="10" fill="#fff4e7"/>
    <rect x="102" y="448" width="6" height="42" rx="3" fill="#efa856"/>
    <text x="124" y="475" fill="#34445b" font-size="16" font-weight="600">报错、日志与复现</text>
    <text x="336" y="475" fill="#ba792d" font-size="15" text-anchor="end">Logs</text>
  </g>

  <path d="M408 366H461" fill="none" stroke="#8b9aae" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="431" cy="366" r="6" fill="#54cdb2"/>
  <circle cx="449" cy="366" r="4" fill="#7688f8"/>

  <text x="520" y="278" fill="#7ce0c8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="700">CODEX × UE SKILLS</text>
  <text x="520" y="326" fill="#ffffff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="29" font-weight="700">UE PerfectWorld</text>
  <text x="520" y="358" fill="#c7d2e0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">按任务调用专用工作流</text>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">
    <rect x="520" y="386" width="142" height="36" rx="9" fill="#33445d"/>
    <text x="591" y="409" fill="#e6edf7" text-anchor="middle">方案 · 排查</text>
    <rect x="673" y="386" width="158" height="36" rx="9" fill="#33445d"/>
    <text x="752" y="409" fill="#e6edf7" text-anchor="middle">实现 · 审查</text>
  </g>
  <rect x="520" y="440" width="310" height="38" rx="9" fill="#30435b" stroke="#536983"/>
  <circle cx="540" cy="459" r="6" fill="#f2bb62"/>
  <text x="555" y="465" fill="#f7e5c7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">S2 变更规格：等你明确批准</text>

  <path d="M884 366H936" fill="none" stroke="#8b9aae" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="905" cy="366" r="6" fill="#7688f8"/>
  <circle cx="923" cy="366" r="4" fill="#ed8c70"/>

  <text x="998" y="275" fill="#172335" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="700">清晰的工作产物</text>
  <text x="998" y="305" fill="#718096" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">每个结论都能回到依据和状态</text>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <circle cx="1021" cy="359" r="16" fill="#e6f7f2"/>
    <path d="M1014 359l5 5 9-11" fill="none" stroke="#27977f" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1050" y="365" fill="#34445b" font-size="16" font-weight="600">项目证据与问题定位</text>
    <circle cx="1021" cy="407" r="16" fill="#eef0ff"/>
    <path d="M1014 407h14M1021 400v14" stroke="#5968d5" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1050" y="413" fill="#34445b" font-size="16" font-weight="600">获批范围内的实现</text>
    <circle cx="1021" cy="455" r="16" fill="#fff0e7"/>
    <path d="M1013 455l5 5 11-12" fill="none" stroke="#d97752" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1050" y="461" fill="#34445b" font-size="16" font-weight="600">验证记录与交接文档</text>
  </g>

  <rect x="72" y="538" width="1296" height="62" rx="14" fill="#ffffff" stroke="#dbe4ed"/>
  <circle cx="105" cy="569" r="8" fill="#43b99d"/>
  <text x="127" y="575" fill="#52627a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">
    <tspan font-weight="700" fill="#34445b">它是什么：</tspan>
    Codex 工作流插件
  </text>
  <line x1="452" y1="553" x2="452" y2="585" stroke="#dbe4ed"/>
  <circle cx="486" cy="569" r="8" fill="#7387ff"/>
  <text x="508" y="575" fill="#52627a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">
    <tspan font-weight="700" fill="#34445b">它不是什么：</tspan>
    Unreal Editor 扩展
  </text>
  <line x1="872" y1="553" x2="872" y2="585" stroke="#dbe4ed"/>
  <circle cx="906" cy="569" r="8" fill="#efa856"/>
  <text x="928" y="575" fill="#52627a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">
    <tspan font-weight="700" fill="#34445b">RAG：</tspan>
    可选外部能力；结果仍需源码核实
  </text>

  <path d="M72 624H1368" stroke="url(#flow)" stroke-width="4" stroke-linecap="round"/>
</svg>

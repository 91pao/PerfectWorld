<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">UE PerfectWorld 多子代理协作总览</title>
  <desc id="desc">主代理明确目标、拆分任务并持续推进关键路径；多个子代理按依赖开展证据收集、分块实施、验证和独立审查，结果汇回主代理整合。每个文件或资产同一时间只有一个写入者。稳定版本经过确认缺陷、范围内修复、受影响复验和最新版复审的回环后交付。S0-S6 是检查点，不是七轮审批或七个代理。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#74869b"/>
    </marker>
    <marker id="loop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#ba5d48"/>
    </marker>
  </defs>
  <rect width="1440" height="900" rx="20" fill="#f5f7fb"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="48" y="52" fill="#587087" font-size="15" font-weight="700">UNREAL ENGINE DEVELOPMENT · CODEX PLUGIN</text>
    <text x="48" y="110" fill="#172335" font-size="42" font-weight="700">UE PerfectWorld</text>
    <text x="48" y="150" fill="#52627a" font-size="21">主代理统筹，多子代理协作，以项目证据完成有界改动</text>

    <text x="48" y="199" fill="#52627a" font-size="14" font-weight="700">执行组织</text>
    <text x="620" y="199" fill="#52627a" font-size="14">职责示例 · 按依赖启动并复用代理</text>

    <g fill="none" stroke="#74869b" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M240 349H290"/>
      <path d="M532 349H574V261H618"/>
      <path d="M574 349H618"/>
      <path d="M574 349V437H618"/>
      <path d="M880 261H922V349H962"/>
      <path d="M880 349H962"/>
      <path d="M880 437H922V349"/>
    </g>

    <rect x="48" y="249" width="192" height="200" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
    <text x="72" y="286" fill="#27384e" font-size="21" font-weight="700">你的 UE 项目</text>
    <text x="72" y="326" fill="#52627a" font-size="16">C++ 与蓝图</text>
    <text x="72" y="357" fill="#52627a" font-size="16">配置与资产引用</text>
    <text x="72" y="388" fill="#52627a" font-size="16">日志与复现</text>
    <text x="72" y="424" fill="#217c6b" font-size="14">当前工程直接查证</text>

    <rect x="292" y="237" width="240" height="224" rx="8" fill="#20334c"/>
    <text x="318" y="277" fill="#83ddc8" font-size="15" font-weight="700">主代理 · 拆分与推进</text>
    <text x="318" y="318" fill="#ffffff" font-size="23" font-weight="700">目标 / 范围 / 接口</text>
    <text x="318" y="355" fill="#d1dce8" font-size="16">给子任务明确边界</text>
    <text x="318" y="386" fill="#d1dce8" font-size="16">持续推进关键路径</text>
    <line x1="318" y1="407" x2="506" y2="407" stroke="#50627a"/>
    <text x="318" y="437" fill="#f3ce8b" font-size="14">先复用、配置、局部修复</text>

    <rect x="620" y="221" width="260" height="80" rx="8" fill="#e6f6f0" stroke="#b9ded1"/>
    <text x="644" y="252" fill="#217c6b" font-size="18" font-weight="700">子代理 A · 并行证据</text>
    <text x="644" y="279" fill="#45675e" font-size="14">调用链 / 所有权 / 配置与资产</text>
    <rect x="620" y="309" width="260" height="80" rx="8" fill="#edf0ff" stroke="#cdd5f6"/>
    <text x="644" y="340" fill="#4e5fc2" font-size="18" font-weight="700">子代理 B · 分块实施</text>
    <text x="644" y="367" fill="#59677d" font-size="14">证据与规格就绪 · 每文件单写者</text>
    <rect x="620" y="397" width="260" height="80" rx="8" fill="#fff0e9" stroke="#edcdbf"/>
    <text x="644" y="428" fill="#aa5d44" font-size="18" font-weight="700">子代理 C · 验证 / 审查</text>
    <text x="644" y="455" fill="#856a5d" font-size="14">稳定 diff · 审查独立于作者</text>

    <rect x="964" y="237" width="428" height="224" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
    <text x="990" y="277" fill="#217c6b" font-size="15" font-weight="700">主代理 · 汇合与整合</text>
    <text x="990" y="318" fill="#27384e" font-size="23" font-weight="700">统一接口、证据与最终版本</text>
    <text x="990" y="355" fill="#52627a" font-size="16">核对跨任务契约与共同假设</text>
    <text x="990" y="386" fill="#52627a" font-size="16">确认发现，修复范围内问题</text>
    <line x1="990" y1="407" x2="1366" y2="407" stroke="#d9e2ec"/>
    <text x="990" y="437" fill="#52627a" font-size="14">小任务直接完成；并发按真实容量调整</text>

    <line x1="48" y1="508" x2="1392" y2="508" stroke="#d9e2ec"/>
    <text x="48" y="544" fill="#27384e" font-size="20" font-weight="700">稳定版本上的验证、独立审查与修复回环</text>
    <text x="48" y="574" fill="#52627a" font-size="14">验证与独立审查可重叠；移动中的文件要在最新整合版本再次核对</text>

    <g fill="none" stroke="#74869b" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M218 654H246V620H278"/>
      <path d="M246 654V704H278"/>
      <path d="M458 620H486V654H516"/>
      <path d="M458 704H486V654"/>
      <path d="M688 654H736"/>
      <path d="M908 654H956"/>
      <path d="M1128 654H1176"/>
    </g>
    <rect x="48" y="616" width="170" height="76" rx="8" fill="#ffffff" stroke="#cfd9e4"/>
    <text x="133" y="648" text-anchor="middle" fill="#27384e" font-size="18" font-weight="700">稳定 diff</text>
    <text x="133" y="675" text-anchor="middle" fill="#52627a" font-size="14">基线 + 需求 + 证据</text>
    <rect x="280" y="590" width="178" height="60" rx="8" fill="#e6f6f0" stroke="#b9ded1"/>
    <text x="369" y="627" text-anchor="middle" fill="#217c6b" font-size="18" font-weight="700">验证</text>
    <rect x="280" y="674" width="178" height="60" rx="8" fill="#fff0e9" stroke="#edcdbf"/>
    <text x="369" y="711" text-anchor="middle" fill="#aa5d44" font-size="18" font-weight="700">独立审查</text>
    <rect x="518" y="616" width="170" height="76" rx="8" fill="#ffffff" stroke="#cfd9e4"/>
    <text x="603" y="648" text-anchor="middle" fill="#27384e" font-size="18" font-weight="700">主代理确认缺陷</text>
    <text x="603" y="675" text-anchor="middle" fill="#52627a" font-size="14">以源码与契约为准</text>
    <rect x="738" y="616" width="170" height="76" rx="8" fill="#edf0ff" stroke="#cdd5f6"/>
    <text x="823" y="648" text-anchor="middle" fill="#4e5fc2" font-size="18" font-weight="700">范围内修复</text>
    <text x="823" y="675" text-anchor="middle" fill="#59677d" font-size="14">不扩张职责与机制</text>
    <rect x="958" y="616" width="170" height="76" rx="8" fill="#e6f6f0" stroke="#b9ded1"/>
    <text x="1043" y="648" text-anchor="middle" fill="#217c6b" font-size="18" font-weight="700">受影响复验</text>
    <text x="1043" y="675" text-anchor="middle" fill="#45675e" font-size="14">只声明实际检查</text>
    <rect x="1178" y="616" width="214" height="76" rx="8" fill="#fff0e9" stroke="#edcdbf"/>
    <text x="1285" y="648" text-anchor="middle" fill="#aa5d44" font-size="18" font-weight="700">最新版独立复审</text>
    <text x="1285" y="675" text-anchor="middle" fill="#856a5d" font-size="14">确认收敛后交付</text>
    <path d="M1285 694V764H603V694" fill="none" stroke="#ba5d48" stroke-width="2.5" marker-end="url(#loop)"/>
    <rect x="838" y="751" width="214" height="26" fill="#f5f7fb"/>
    <text x="945" y="770" text-anchor="middle" fill="#aa5d44" font-size="14" font-weight="700">仍有确认缺陷 → 再修复</text>

    <rect x="48" y="810" width="1344" height="58" rx="8" fill="#20334c"/>
    <text x="72" y="834" fill="#ffffff" font-size="14" font-weight="700">S0-S6 是证据检查点，可在授权内连续推进；规划、诊断、审查和不改文件请求保持只读</text>
    <text x="72" y="855" fill="#cbd7e5" font-size="13">setup 默认子代理上限 12，不含主代理；受运行时容量约束，不必填满 · Codex 工作流插件 · RAG 可选且需回到项目核实</text>
  </g>
</svg>
